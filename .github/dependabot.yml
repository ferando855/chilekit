version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "tsup"
          - "tsx"
          - "vitest"
    ignore:
      # @types/node sigue la version minima soportada de Node (engines), no la ultima.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 (compilador nativo) elimina baseUrl y aun no expone la API que usa
      # tsup para generar .d.ts. Se retoma junto con la migracion del build a tsdown.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
