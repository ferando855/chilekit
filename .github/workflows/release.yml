name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@chilekit/cli
    permissions:
      contents: write # crear el GitHub Release
      id-token: write # npm provenance y trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Sin cache de dependencias: el job de release no debe consumir caches que un PR pudo escribir.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs "$TAG"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Pack
        run: |
          mkdir -p dist-release
          for pkg in core sources mcp cli; do
            pnpm --filter "@chilekit/${pkg}" pack --pack-destination "$GITHUB_WORKSPACE/dist-release"
          done
          ls -l dist-release

      # npm >= 11.5.1 soporta trusted publishing via OIDC. Si NPM_TOKEN existe (primera
      # publicacion, antes de configurar el trusted publisher), se usa como respaldo.
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          for pkg in core sources mcp cli; do
            npm publish dist-release/chilekit-${pkg}-*.tgz --provenance --access public
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist-release/*.tgz --title "$TAG" --generate-notes --verify-tag
